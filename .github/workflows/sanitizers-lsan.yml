name: LeakSanitizer Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lsan:
    name: LSan - Detect memory leaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure with LSan
        run: |
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSTELLYRA_BUILD_TESTS=ON -DSTELLYRA_FETCH_GOOGLETEST=ON
        env:
          CXXFLAGS: "-fsanitize=leak -fno-omit-frame-pointer"
          LDFLAGS: "-fsanitize=leak"

      - name: Build
        run: cmake --build build --config Debug

      - name: Run tests with LSan
        run: cd build/tests && ctest --output-on-failure
        env:
          LSAN_OPTIONS: >-
            halt_on_error=1:
            abort_on_error=1:
            color=always
